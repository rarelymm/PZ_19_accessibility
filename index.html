<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Доступная библиотека</title>
    <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
    <header class="header">
        <h1>Библиотека</h1>
        <nav><a href="#books">Книги</a><a href="#about">О проекте</a></nav>
    </header>
    <main>
        <section class="hero">
            <img src="./images/бкпнг.png" class="hero__image" alt="Иллюстрация открытой книги" />
            <div>
                <p>Учебная библиотека</p>
                <h2>Книги для самостоятельного обучения</h2>
                <p>
                    ааааааааааааааааааааааааааааааааа все работает все круто
                </p>
                <button class="hero__button" type="button">Открыть каталог</button>
            </div>
        </section>
        <section id="books">
            <h2>Популярные книги</h2>
            <article class="book">
                <img src="./images/бкпнг.png" alt="Обложка книги" />
                <h3>Бойцовский клуб</h3>
                <p>Лишь утратив всё до конца мы обретаем свободу</p>
                <a href="#">Подробнее</a>
            </article>
        </section>
        <section id="about"><h2 id="about">О проекте</h2>
          мы очень крутые не скам и не ларперы
        </section>
    </main>
</body>
</html>
